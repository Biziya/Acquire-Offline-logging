# Upload Data page settings. The table's columns, widths and row height come
# from Raw Litho's config.yaml, so the two tables always match.

title: "Upload Data"

table:
  overscan: 10           # rows rendered above and below the visible window
  # The table grows with its records up to this share of the window height,
  # then scrolls inside its frame.
  maxHeightVh: 65        # percent of the viewport height
  statusColumnWidth: 40  # px, the validation-status column

search:
  debounceMs: 200        # wait after the last keystroke before filtering

draft:
  # The loaded file and its edits are kept in IndexedDB (upload-data-db) so
  # they survive navigation and refresh. Edits are written once typing pauses.
  saveDebounceMs: 800    # wait after the last edit before saving the draft
